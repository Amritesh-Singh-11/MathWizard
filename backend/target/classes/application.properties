spring.application.name=mathwizard-backend
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/mathwizard

# Python Math Engine URL
math.engine.url=http://${MATH_ENGINE_HOST:localhost}:${MATH_ENGINE_PORT:8000}

# Logging
logging.level.com.mathwizard=INFO
